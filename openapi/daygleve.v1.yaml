# DaygleVE REST API — v1
#
# This document describes the endpoint surface (paths, methods, auth and status
# codes) of the DaygleVE backend. The request/response *shapes* are the
# authoritative Rust types in `src/` and their generated TypeScript bindings;
# the schema objects below are intentionally summarised and reference those.
#
# Keep this file in sync with the backend router and the Rust types.
openapi: 3.1.0
info:
  title: DaygleVE API
  version: "1.0.0"
  description: >
    Single-node virtualization control API for KVM/QEMU VMs, LXC containers,
    ZFS storage, Linux networking, GPU passthrough and metrics.
  license:
    name: Apache-2.0
servers:
  - url: /api/v1
security:
  - bearerAuth: []

tags:
  - name: auth
  - name: vms
  - name: containers
  - name: storage
  - name: network
  - name: gpus
  - name: metrics
  - name: system
  - name: operations

paths:
  /health:
    get:
      tags: [system]
      summary: Liveness/readiness probe.
      security: []
      responses:
        "200": { $ref: "#/components/responses/HealthStatus" }

  /auth/login:
    post:
      tags: [auth]
      summary: Exchange credentials for a bearer token.
      security: []
      requestBody: { $ref: "#/components/requestBodies/LoginRequest" }
      responses:
        "200": { $ref: "#/components/responses/LoginResponse" }
        "401": { $ref: "#/components/responses/Error" }
  /auth/me:
    get:
      tags: [auth]
      summary: Return the caller's identity and effective permissions.
      responses:
        "200": { $ref: "#/components/responses/CurrentUser" }
        "401": { $ref: "#/components/responses/Error" }
  /auth/logout:
    post:
      tags: [auth]
      summary: Revoke the current bearer session.
      responses:
        "204": { description: Session revoked. }
        "401": { $ref: "#/components/responses/Error" }
  /operations:
    get:
      tags: [operations]
      summary: List durable host operations and crash-recovery records.
      responses:
        "200": { $ref: "#/components/responses/OperationList" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /operations/{id}:
    parameters: [ { $ref: "#/components/parameters/Id" } ]
    get:
      tags: [operations]
      summary: Read one operation for polling an asynchronous job.
      responses:
        "200": { $ref: "#/components/responses/Operation" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /operations/reconcile:
    post:
      tags: [operations]
      summary: >
        Start an asynchronous host-state reconciliation scan. Returns a 202 with
        the operation record; poll until it reaches a terminal state. The scan
        compares persisted records to live host state and reports drift findings
        (e.g. VMs/containers/bridges that exist in one but not the other) without
        auto-correcting.
      responses:
        "202": { $ref: "#/components/responses/Operation" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

  /auth/change-password:
    post:
      tags: [auth]
      summary: Change the current user's password.
      requestBody: { $ref: "#/components/requestBodies/ChangePasswordRequest" }
      responses:
        "204": { description: Password changed. }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }

  /vms:
    get:
      tags: [vms]
      summary: List virtual machines. Requires `vm_read`.
      parameters: [ { $ref: "#/components/parameters/Page" }, { $ref: "#/components/parameters/PerPage" } ]
      responses:
        "200": { $ref: "#/components/responses/VmPage" }
    post:
      tags: [vms]
      summary: >
        Create a virtual machine asynchronously. Returns a 202 with the operation record;
        poll `GET /operations/{id}` until it reaches a terminal state.
      requestBody: { $ref: "#/components/requestBodies/CreateVmRequest" }
      responses:
        "202": { $ref: "#/components/responses/Operation" }
        "400": { $ref: "#/components/responses/Error" }
  /vms/{id}:
    parameters: [ { $ref: "#/components/parameters/Id" } ]
    get:
      tags: [vms]
      summary: Get a virtual machine. Requires `vm_read`.
      responses:
        "200": { $ref: "#/components/responses/Vm" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      tags: [vms]
      summary: Update a virtual machine. Requires `vm_write`.
      requestBody: { $ref: "#/components/requestBodies/UpdateVmRequest" }
      responses:
        "200": { $ref: "#/components/responses/Vm" }
    delete:
      tags: [vms]
      summary: Delete a virtual machine. Requires `vm_write`.
      responses:
        "204": { description: Deleted. }
  /vms/{id}/clone:
    parameters: [ { $ref: "#/components/parameters/Id" } ]
    post:
      tags: [vms]
      summary: >
        Create a stopped VM clone asynchronously. Returns a 202 with the operation
        record; poll until it reaches a terminal state.
      requestBody: { $ref: "#/components/requestBodies/CloneVmRequest" }
      responses:
        "202": { $ref: "#/components/responses/Operation" }
  /vms/{id}/power:
    parameters: [ { $ref: "#/components/parameters/Id" } ]
    post:
      tags: [vms]
      summary: Perform a power action. Requires `vm_power`.
      requestBody: { $ref: "#/components/requestBodies/VmPowerRequest" }
      responses:
        "202": { $ref: "#/components/responses/Vm" }
  /vms/{id}/console:
    parameters: [ { $ref: "#/components/parameters/Id" } ]
    post:
      tags: [vms]
      summary: Issue a short-lived noVNC console ticket. Requires `vm_power`.
      responses:
        "200": { $ref: "#/components/responses/ConsoleTicket" }

  /containers:
    get:
      tags: [containers]
      summary: List LXC containers. Requires `lxc_read`.
      parameters: [ { $ref: "#/components/parameters/Page" }, { $ref: "#/components/parameters/PerPage" } ]
      responses:
        "200": { $ref: "#/components/responses/LxcPage" }
    post:
      tags: [containers]
      summary: >
        Create an LXC container asynchronously. Returns a 202 with the operation
        record; poll until it reaches a terminal state.
      requestBody: { $ref: "#/components/requestBodies/CreateLxcRequest" }
      responses:
        "202": { $ref: "#/components/responses/Operation" }
  /containers/{id}:
    parameters: [ { $ref: "#/components/parameters/Id" } ]
    get:
      tags: [containers]
      summary: Get an LXC container. Requires `lxc_read`.
      responses:
        "200": { $ref: "#/components/responses/Lxc" }
    patch:
      tags: [containers]
      summary: Update an LXC container. Requires `lxc_write`.
      requestBody: { $ref: "#/components/requestBodies/UpdateLxcRequest" }
      responses:
        "200": { $ref: "#/components/responses/Lxc" }
    delete:
      tags: [containers]
      summary: Delete an LXC container. Requires `lxc_write`.
      responses:
        "204": { description: Deleted. }
  /containers/{id}/power:
    parameters: [ { $ref: "#/components/parameters/Id" } ]
    post:
      tags: [containers]
      summary: Perform a power action. Requires `lxc_power`.
      requestBody: { $ref: "#/components/requestBodies/LxcPowerRequest" }
      responses:
        "202": { $ref: "#/components/responses/Lxc" }
  /containers/{id}/snapshots:
    parameters: [ { $ref: "#/components/parameters/Id" } ]
    get:
      tags: [containers]
      summary: List snapshots of an LXC root filesystem. Requires `lxc_read`.
      responses:
        "200": { $ref: "#/components/responses/LxcSnapshotList" }
    post:
      tags: [containers]
      summary: Create an LXC root filesystem snapshot. Requires `lxc_write`.
      requestBody: { $ref: "#/components/requestBodies/CreateLxcSnapshotRequest" }
      responses:
        "201": { $ref: "#/components/responses/LxcSnapshot" }
  /containers/{id}/snapshots/{name}:
    parameters:
      - { $ref: "#/components/parameters/Id" }
      - name: name
        in: path
        required: true
        schema: { type: string }
    delete:
      tags: [containers]
      summary: Delete an LXC snapshot. Requires `lxc_write`.
      responses:
        "204": { description: Deleted. }
  /containers/{id}/snapshots/{name}/rollback:
    parameters:
      - { $ref: "#/components/parameters/Id" }
      - name: name
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [containers]
      summary: Roll an LXC root filesystem back to a snapshot. Requires `lxc_write`.
      responses:
        "204": { description: Rolled back. }

  /storage/pools:
    get:
      tags: [storage]
      summary: List ZFS pools. Requires `storage_read`.
      responses:
        "200": { $ref: "#/components/responses/PoolList" }
  /storage/datasets:
    get:
      tags: [storage]
      summary: List datasets. Requires `storage_read`.
      responses:
        "200": { $ref: "#/components/responses/DatasetList" }
    post:
      tags: [storage]
      summary: >
        Create a dataset or zvol asynchronously. Returns a 202 with the operation
        record; poll until it reaches a terminal state.
      requestBody: { $ref: "#/components/requestBodies/CreateDatasetRequest" }
      responses:
        "202": { $ref: "#/components/responses/Operation" }
  /storage/datasets/{id}/snapshots:
    parameters: [ { $ref: "#/components/parameters/Id" } ]
    get:
      tags: [storage]
      summary: List snapshots of a dataset. Requires `storage_read`.
      responses:
        "200": { $ref: "#/components/responses/SnapshotList" }
    post:
      tags: [storage]
      summary: >
        Snapshot a dataset asynchronously. Returns a 202 with the operation record;
        poll until it reaches a terminal state.
      requestBody: { $ref: "#/components/requestBodies/CreateSnapshotRequest" }
      responses:
        "202": { $ref: "#/components/responses/Operation" }
  /storage/snapshots/{id}/clone:
    parameters: [ { $ref: "#/components/parameters/Id" } ]
    post:
      tags: [storage]
      summary: >
        Clone a snapshot into a new dataset asynchronously. Returns a 202 with the
        operation record; poll until it reaches a terminal state.
      requestBody: { $ref: "#/components/requestBodies/CloneSnapshotRequest" }
      responses:
        "202": { $ref: "#/components/responses/Operation" }

  /network/bridges:
    get:
      tags: [network]
      summary: List Linux bridges. Requires `network_read`.
      responses:
        "200": { $ref: "#/components/responses/BridgeList" }
    post:
      tags: [network]
      summary: >
        Create a bridge asynchronously. Returns a 202 with the operation record;
        poll until it reaches a terminal state.
      requestBody: { $ref: "#/components/requestBodies/CreateBridgeRequest" }
      responses:
        "202": { $ref: "#/components/responses/Operation" }
  /network/vlans:
    get:
      tags: [network]
      summary: List VLANs. Requires `network_read`.
      responses:
        "200": { $ref: "#/components/responses/VlanList" }
    post:
      tags: [network]
      summary: >
        Create a VLAN asynchronously. Returns a 202 with the operation record;
        poll until it reaches a terminal state.
      requestBody: { $ref: "#/components/requestBodies/CreateVlanRequest" }
      responses:
        "202": { $ref: "#/components/responses/Operation" }

  /gpus:
    get:
      tags: [gpus]
      summary: List host GPUs eligible for passthrough. Requires `gpu_read`.
      responses:
        "200": { $ref: "#/components/responses/GpuList" }
  /gpus/{pci_address}/bind:
    parameters:
      - name: pci_address
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [gpus]
      summary: >
        Bind a host GPU to vfio-pci for passthrough asynchronously. Returns a 202
        with the operation record; poll until it reaches a terminal state.
      requestBody: { $ref: "#/components/requestBodies/BindGpuRequest" }
      responses:
        "202": { $ref: "#/components/responses/Operation" }

  /metrics/node:
    get:
      tags: [metrics]
      summary: Current node metrics. Requires `metrics_read`.
      responses:
        "200": { $ref: "#/components/responses/NodeMetrics" }
  /metrics/stream:
    get:
      tags: [metrics]
      summary: >
        Server-Sent Events stream of `MetricsEvent` frames (node + guests).
        Requires `metrics_read`.
      responses:
        "200":
          description: text/event-stream of MetricsEvent frames.
          content:
            text/event-stream:
              schema: { $ref: "#/components/schemas/MetricsEvent" }

# ---------------------------------------------------------------------------
# Components. Schemas are summarised; the Rust types in `src/` are canonical.
# ---------------------------------------------------------------------------
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/ResourceId" }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1 }
    PerPage:
      name: per_page
      in: query
      schema: { type: integer, minimum: 1 }

  schemas:
    ResourceId: { type: string, description: "Opaque UUID-v4 resource id." }
    ApiError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum: [validation, unauthorized, forbidden, not_found, conflict, hypervisor_error, internal]
        message: { type: string }
        details:
          type: array
          items: { $ref: "#/components/schemas/FieldError" }
        request_id: { type: string }
    FieldError:
      type: object
      required: [field, message]
      properties:
        field: { type: string }
        message: { type: string }
    # The following are documented in full by the generated bindings.
    HealthStatus: { type: object }
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string, minLength: 1, maxLength: 64 }
        password: { type: string, format: password, minLength: 8 }
    LoginResponse:
      type: object
      required: [token, expires_at, user]
      properties:
        token: { type: string }
        expires_at: { type: string, format: date-time }
        user: { $ref: "#/components/schemas/User" }
    CurrentUser:
      type: object
      required: [user, permissions, must_change_password]
      properties:
        user: { $ref: "#/components/schemas/User" }
        permissions: { type: array, items: { $ref: "#/components/schemas/Permission" } }
        must_change_password: { type: boolean }
    Permission:
      type: string
      enum: [vm_read, vm_write, vm_power, lxc_read, lxc_write, lxc_power, storage_read, storage_write, network_read, network_write, gpu_read, gpu_write, operations_read, operations_write, metrics_read, user_admin]
    OperationStatus:
      type: string
      enum: [queued, running, succeeded, failed, needs_review, cancelled]
    OperationRecord:
      type: object
      required: [id, kind, status, created_at]
      properties:
        id: { $ref: "#/components/schemas/ResourceId" }
        kind: { type: string }
        status: { $ref: "#/components/schemas/OperationStatus" }
        progress_pct: { type: integer, minimum: 0, maximum: 100 }
        resource_type: { type: string }
        resource_id: { $ref: "#/components/schemas/ResourceId" }
        result_id: { $ref: "#/components/schemas/ResourceId", description: "ID of the resource created or modified by this operation." }
        created_at: { type: string, format: date-time }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
        message: { type: string }
        error: { type: string }
    User:
      type: object
      required: [id, username, roles, created_at]
      properties:
        id: { $ref: "#/components/schemas/ResourceId" }
        username: { type: string }
        roles: { type: array, items: { type: string, enum: [admin, operator, viewer] } }
        created_at: { type: string, format: date-time }
        last_login_at: { type: string, format: date-time }
    Vm: { type: object }
    VmSummary: { type: object }
    CreateVmRequest: { type: object }
    UpdateVmRequest: { type: object }
    VmPowerRequest: { type: object }
    ConsoleTicket: { type: object }
    Lxc: { type: object }
    LxcSummary: { type: object }
    CreateLxcRequest: { type: object }
    UpdateLxcRequest: { type: object }
    LxcPowerRequest: { type: object }
    LxcSnapshot:
      type: object
      required: [id, name, container_id, dataset, used_bytes, created_at]
      properties:
        id: { $ref: "#/components/schemas/ResourceId" }
        name: { type: string }
        container_id: { $ref: "#/components/schemas/ResourceId" }
        dataset: { type: string }
        used_bytes: { type: integer, format: uint64 }
        created_at: { type: string, format: date-time }
    Pool: { type: object }
    Dataset: { type: object }
    Snapshot: { type: object }
    CreateDatasetRequest: { type: object }
    CreateSnapshotRequest: { type: object }
    CloneSnapshotRequest: { type: object }
    Bridge: { type: object }
    Vlan: { type: object }
    CreateBridgeRequest: { type: object }
    CreateVlanRequest: { type: object }
    GpuDevice: { type: object }
    BindGpuRequest: { type: object }
    NodeMetrics: { type: object }
    MetricsEvent: { type: object }

  parameters_note: "See src/*.rs for authoritative field-level definitions."

  requestBodies:
    CreateLxcSnapshotRequest:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [name]
            properties:
              name: { type: string, minLength: 1 }
              description: { type: string }
    LoginRequest: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/LoginRequest" } } } }
    CreateVmRequest: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CreateVmRequest" } } } }
    UpdateVmRequest: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/UpdateVmRequest" } } } }
    VmPowerRequest: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/VmPowerRequest" } } } }
    CreateLxcRequest: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CreateLxcRequest" } } } }
    UpdateLxcRequest: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/UpdateLxcRequest" } } } }
    LxcPowerRequest: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/LxcPowerRequest" } } } }
    CreateDatasetRequest: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CreateDatasetRequest" } } } }
    CreateSnapshotRequest: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CreateSnapshotRequest" } } } }
    CloneSnapshotRequest: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CloneSnapshotRequest" } } } }
    CreateBridgeRequest: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CreateBridgeRequest" } } } }
    CreateVlanRequest: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CreateVlanRequest" } } } }
    BindGpuRequest: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/BindGpuRequest" } } } }
    ChangePasswordRequest: { required: true, content: { application/json: { schema: { type: object, required: [current_password, new_password], properties: { current_password: { type: string, format: password }, new_password: { type: string, format: password, minLength: 8 } } } } } }

  responses:
    Error:
      description: Error envelope.
      content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } }
    HealthStatus:
      description: OK
      content: { application/json: { schema: { $ref: "#/components/schemas/HealthStatus" } } }
    LoginResponse:
      description: OK
      content: { application/json: { schema: { $ref: "#/components/schemas/LoginResponse" } } }
    CurrentUser:
      description: OK
      content: { application/json: { schema: { $ref: "#/components/schemas/CurrentUser" } } }
    Vm:
      description: OK
      content: { application/json: { schema: { $ref: "#/components/schemas/Vm" } } }
    VmPage:
      description: OK
      content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/VmSummary" } } } } } }
    ConsoleTicket:
      description: OK
      content: { application/json: { schema: { $ref: "#/components/schemas/ConsoleTicket" } } }
    Lxc:
      description: OK
      content: { application/json: { schema: { $ref: "#/components/schemas/Lxc" } } }
    LxcPage:
      description: OK
      content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/LxcSummary" } } } } } }
    LxcSnapshot:
      description: OK
      content: { application/json: { schema: { $ref: "#/components/schemas/LxcSnapshot" } } }
    LxcSnapshotList:
      description: OK
      content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/LxcSnapshot" } } } }
    OperationList:
      description: OK
      content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/OperationRecord" } } } }
    Operation:
      description: OK
      content: { application/json: { schema: { $ref: "#/components/schemas/OperationRecord" } } }
    PoolList:
      description: OK
      content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Pool" } } } }
    DatasetList:
      description: OK
      content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Dataset" } } } }
    Dataset:
      description: OK
      content: { application/json: { schema: { $ref: "#/components/schemas/Dataset" } } }
    SnapshotList:
      description: OK
      content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Snapshot" } } } }
    Snapshot:
      description: OK
      content: { application/json: { schema: { $ref: "#/components/schemas/Snapshot" } } }
    BridgeList:
      description: OK
      content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Bridge" } } } }
    Bridge:
      description: OK
      content: { application/json: { schema: { $ref: "#/components/schemas/Bridge" } } }
    VlanList:
      description: OK
      content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Vlan" } } } }
    Vlan:
      description: OK
      content: { application/json: { schema: { $ref: "#/components/schemas/Vlan" } } }
    GpuList:
      description: OK
      content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/GpuDevice" } } } }
    GpuDevice:
      description: OK
      content: { application/json: { schema: { $ref: "#/components/schemas/GpuDevice" } } }
    NodeMetrics:
      description: OK
      content: { application/json: { schema: { $ref: "#/components/schemas/NodeMetrics" } } }
